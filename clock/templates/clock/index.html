{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>tokei ⏰</title>
    <link rel="stylesheet" href="{% static 'clock/style.css' %}">
    <script src="{% static 'clock/main.js' %}" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
</head>

<body
{% if photo %}
style="background-image:url('{{ photo.image.url }}'); background-size:cover; background-position:center;"
{% endif %}
>

<div id="rotate-warning">
    <div class="rotate-box">
        <p>📱 画面を横向きにしてください</p>
    </div>
</div>

<!-- タブボタン -->
<div class="tab-buttons">
    <button class="tab-btn active" data-target="clock-section">時計 🕒</button>
    <button class="tab-btn" data-target="stopwatch-section">ストップウォッチ ⏱</button>
    <button class="tab-btn" data-target="timer-section">タイマー ⏲</button>
</div>

<!-- 時計 -->
<div id="clock-section" class="tab-section active clock-container">
    <h1 id="clock">00:00:00</h1>
</div>

<!-- ストップウォッチ -->
<div id="stopwatch-section" class="tab-section stopwatch-container">
    <h1 id="stopwatch">00:00:00</h1>
    <button id="sw-start">開始</button>
    <button id="sw-stop">停止</button>
    <button id="sw-reset">リセット</button>
</div>

<!-- タイマー -->
<div id="timer-section" class="tab-section timer-container">

    <div class="timer-picker">

        <div class="wheel-group">
            <div class="wheel" id="hours-wheel">
                <div class="wheel-list" id="hours-list"></div>
            </div>
            <span>時間</span>
        </div>

        <div class="wheel-group">
            <div class="wheel" id="minutes-wheel">
                <div class="wheel-list" id="minutes-list"></div>
            </div>
            <span>分</span>
        </div>

        <div class="wheel-group">
            <div class="wheel" id="seconds-wheel">
                <div class="wheel-list" id="seconds-list"></div>
            </div>
            <span>秒</span>
        </div>

    </div>

    <div class="timer-buttons">
        <button id="timer-start">開始</button>
        <button id="timer-reset">リセット</button>
    </div>

</div>
<a href="{% url 'clock:settings' %}">
    <button class="settings-btn">⚙ 設定</button>
</a>

<!-- 🔔 タイマー終了画面（最初は非表示） -->
<div id="timer-finish" class="timer-finish hidden">
    <div class="finish-box">
        <h1>終了！！⏰</h1>
        <p>おつかれさま ☕️</p>
        <button id="finish-close">OK</button>
    </div>
</div>

</body>
</html>
